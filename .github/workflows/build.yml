name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          Write-Host "Setting version to: $version"
          $content = Get-Content gui.py -Raw
          $content = $content -replace '__version__ = "[^"]*"', "__version__ = `"$version`""
          Set-Content gui.py $content
        shell: pwsh

      - name: Build executable
        run: python build.py

      - name: Zip release
        run: Compress-Archive -Path dist/GorgonTracker -DestinationPath GorgonTracker-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GorgonTracker-windows
          path: GorgonTracker-windows.zip

      # Create release on tag push (v*)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: GorgonTracker-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create/update rolling release on main branch push
      - name: Get previous release commit
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        id: prev_release
        run: |
          # Get the commit SHA of the 'latest' tag (previous release)
          $prevSha = git rev-list -n 1 latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            # No previous release, use first commit
            $prevSha = git rev-list --max-parents=0 HEAD
          }
          echo "SHA=$prevSha" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Generate Changelog
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          $prevSha = "${{ steps.prev_release.outputs.SHA }}"
          $changelog = git log --pretty=format:"- %s" "$prevSha..HEAD"
          echo "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
          echo $changelog >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Update Latest Release
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          files: GorgonTracker-windows.zip
          prerelease: true
          body: |
            Automated build from the latest commit on main branch.

            ## Changes since last release
            ${{ steps.changelog.outputs.CHANGELOG }}

            ---
            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.timestamp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
