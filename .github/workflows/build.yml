name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for tags and changelog

      - name: Get latest version and increment
        id: version
        run: |
          # Get the latest version tag
          $latestTag = git describe --tags --abbrev=0 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $latestTag) {
            $latestTag = "v0.0.0"
          }
          Write-Host "Latest tag: $latestTag"

          # Parse version (v1.2.3 -> 1, 2, 3)
          $version = $latestTag.TrimStart('v')
          $parts = $version.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          # Increment patch version
          $patch++
          $newVersion = "$major.$minor.$patch"
          $newTag = "v$newVersion"

          Write-Host "New version: $newVersion"
          Write-Host "New tag: $newTag"

          echo "VERSION=$newVersion" >> $env:GITHUB_OUTPUT
          echo "TAG=$newTag" >> $env:GITHUB_OUTPUT
          echo "PREV_TAG=$latestTag" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject version into gui.py
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Write-Host "Setting version to: $version"
          $content = Get-Content gui.py -Raw
          $content = $content -replace '__version__ = "[^"]*"', "__version__ = `"$version`""
          Set-Content gui.py $content
        shell: pwsh

      - name: Build executable
        run: python build.py

      - name: Zip release
        run: Compress-Archive -Path dist/GorgonTracker -DestinationPath GorgonTracker-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GorgonTracker-windows
          path: GorgonTracker-windows.zip

      - name: Generate Changelog
        id: changelog
        run: |
          $prevTag = "${{ steps.version.outputs.PREV_TAG }}"
          Write-Host "Generating changelog from $prevTag to HEAD"
          $changelog = git log --pretty=format:"- %s" "$prevTag..HEAD" 2>$null
          if (-not $changelog) {
            $changelog = "- Initial release"
          }
          echo "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
          echo $changelog >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: GorgonTracker ${{ steps.version.outputs.TAG }}
          files: GorgonTracker-windows.zip
          body: |
            ## Changes in this release
            ${{ steps.changelog.outputs.CHANGELOG }}

            ---
            **Full Changelog:** https://github.com/${{ github.repository }}/compare/${{ steps.version.outputs.PREV_TAG }}...${{ steps.version.outputs.TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
